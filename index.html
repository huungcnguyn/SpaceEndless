<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thủ Thành Không Gian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<!-- Chữ hiển thị lấy từ src/lang/vi.js qua data-i18n / data-i18n-html. Nội dung động do src/ui/*.js điền. -->
<div id="stage">
  <div id="game"></div>

  <div class="hud" id="hud" hidden>
    <div class="xp"><i id="xpFill"></i></div>
    <div class="hud-row">
      <div class="cluster">
        <span class="label" data-i18n="hud.ship"></span>
        <div class="pips"><span class="pips" id="lives"></span><span class="shield none" id="shield" data-i18n-title="hud.shield"></span></div>
        <span class="label" style="margin-top:.35em" data-i18n="hud.station"></span>
        <div class="stbar" id="stBar"><i id="stFill"></i></div>
      </div>
      <div class="center">
        <div class="wave" id="waveText"></div>
        <span class="label" id="levelText"></span>
        <div class="boss" id="boss">
          <span class="name" id="bossName"></span>
          <div class="bossbar" id="bossBar"><i id="bossFill"></i></div>
        </div>
      </div>
      <div class="cluster right">
        <span class="metal" id="metalText"></span>
        <span class="dmg" id="dmgText"></span>
        <button class="icon-btn" id="pauseBtn" type="button" data-i18n="hud.pause"></button>
      </div>
    </div>
    <span class="keyhint" id="keyhint"></span>
    <button class="special" id="spBtn" type="button" style="--p:0"><span id="spLabel"></span></button>
  </div>

  <div class="banner" id="banner"><h2 id="bannerH"></h2><p id="bannerP"></p></div>
  <div class="flash" id="flash"></div>

  <!-- Màn hình chính -->
  <div class="overlay" id="menu">
    <div class="panel">
      <span class="eyebrow" data-i18n="menu.eyebrow"></span>
      <h1 class="title" data-i18n-html="menu.title"></h1>
      <p class="lead" data-i18n-html="menu.lead"></p>
      <div class="setting">
        <span class="label" data-i18n="menu.control"></span>
        <div class="seg" role="group" data-i18n-aria="menu.controlAria">
          <button type="button" id="ctlKey" data-ctl="keyboard" data-i18n="menu.keyboard"></button>
          <button type="button" id="ctlMouse" data-ctl="mouse" data-i18n="menu.mouse"></button>
        </div>
      </div>
      <div class="setting" id="mouseRow">
        <span class="label" data-i18n="menu.mouseMode"></span>
        <div class="seg" role="group" data-i18n-aria="menu.mouseMode">
          <button type="button" id="mFollow" data-mm="follow" data-i18n="menu.mouseFollow"></button>
          <button type="button" id="mHold" data-mm="hold" data-i18n="menu.mouseHold"></button>
        </div>
      </div>
      <dl class="keys" id="keysList"></dl>
      <div class="actions">
        <button class="btn" id="startBtn" type="button" data-i18n="menu.start"></button>
      </div>
      <div class="foot">
        <span><span data-i18n="menu.totalMetal"></span> <b id="totalMetal">0</b></span>
        <span><span data-i18n="menu.totalCores"></span> <b class="core" id="totalCores">0</b></span>
        <span data-i18n="menu.note"></span>
      </div>
    </div>
  </div>

  <!-- Căn cứ -->
  <div class="overlay" id="baseOv" hidden>
    <div class="panel">
      <div class="head-row"><span class="eyebrow" data-i18n="base.eyebrow"></span><span class="res" id="baseRes"></span></div>
      <h2 class="title sub" data-i18n="base.title"></h2>
      <div class="tiles">
        <button class="tile primary" type="button" id="toStages"><b data-i18n="base.sortie"></b><span data-i18n="base.sortieSub"></span></button>
        <button class="tile" type="button" id="toTree"><b data-i18n="base.tree"></b><span data-i18n="base.treeSub"></span></button>
        <button class="tile" type="button" id="toSpecials"><b data-i18n="base.special"></b><span id="baseSpecial"></span></button>
        <button class="tile" type="button" id="toProfile"><b data-i18n="base.profile"></b><span data-i18n="base.profileSub"></span></button>
      </div>
      <div class="actions"><button class="btn ghost" type="button" id="baseBack" data-i18n="nav.toMain"></button></div>
    </div>
  </div>

  <!-- Chọn màn -->
  <div class="overlay" id="stagesOv" hidden>
    <div class="panel">
      <div class="head-row"><span class="eyebrow" data-i18n="stages.eyebrow"></span></div>
      <h2 class="title sub" data-i18n="stages.title"></h2>
      <div class="pick-list" id="stageList"></div>
      <div class="actions"><button class="btn ghost" type="button" data-back="baseOv" data-i18n="nav.back"></button></div>
    </div>
  </div>

  <!-- Chuẩn bị -->
  <div class="overlay" id="prepOv" hidden>
    <div class="panel">
      <span class="eyebrow" data-i18n="prep.eyebrow"></span>
      <h2 class="title sub" id="prepTitle"></h2>
      <div class="prep-sp">
        <div><span class="label" data-i18n="prep.special"></span><b id="prepSpName"></b><p id="prepSpDesc"></p></div>
        <button class="btn ghost small" type="button" id="prepChangeSp" data-i18n="prep.change"></button>
      </div>
      <span class="label" data-i18n="prep.bonuses"></span>
      <ul class="bonus-list" id="prepBonuses"></ul>
      <div class="actions">
        <button class="btn" type="button" id="goBtn" data-i18n="prep.go"></button>
        <button class="btn ghost" type="button" data-back="stagesOv" data-i18n="nav.back"></button>
      </div>
    </div>
  </div>

  <!-- Special -->
  <div class="overlay" id="specialsOv" hidden>
    <div class="panel">
      <span class="eyebrow" data-i18n="specialsUi.eyebrow"></span>
      <h2 class="title sub" data-i18n="specialsUi.title"></h2>
      <p class="lead" data-i18n="specialsUi.lead"></p>
      <div class="pick-list" id="specialList"></div>
      <div class="actions"><button class="btn ghost" type="button" id="specialsBack" data-i18n="nav.back"></button></div>
    </div>
  </div>

  <!-- Cây nâng cấp -->
  <div class="overlay" id="treeOv" hidden>
    <div class="panel wide">
      <div class="head-row"><span class="eyebrow" data-i18n="treeUi.eyebrow"></span><span class="res" id="treeRes"></span></div>
      <h2 class="title sub" data-i18n="treeUi.title"></h2>
      <p class="lead" data-i18n="treeUi.lead"></p>
      <div class="tabs" role="tablist" id="treeTabs"></div>
      <div class="branches" id="treeBody"></div>
      <div class="actions">
        <button class="btn ghost" type="button" data-back="baseOv" data-i18n="nav.back"></button>
        <button class="btn ghost" type="button" id="resetBtn"></button>
        <span class="note" id="treeNote" role="status"></span>
      </div>
    </div>
  </div>

  <!-- Hồ sơ -->
  <div class="overlay" id="profileOv" hidden>
    <div class="panel">
      <span class="eyebrow" data-i18n="profile.eyebrow"></span>
      <h2 class="title sub" data-i18n="profile.title"></h2>
      <div class="stats" id="profileStats"></div>
      <span class="label" data-i18n="profile.bosses"></span>
      <div class="build left" id="profileBosses"></div>
      <span class="label" data-i18n="profile.save"></span>
      <p class="lead small" data-i18n="profile.saveHint"></p>
      <textarea class="code" id="saveCode" rows="3" spellcheck="false" data-i18n-ph="profile.importPh"></textarea>
      <div class="actions">
        <button class="btn ghost small" type="button" id="copyCode" data-i18n="profile.copy"></button>
        <button class="btn ghost small" type="button" id="importCode" data-i18n="profile.import"></button>
        <span class="note" id="codeNote" role="status"></span>
      </div>
      <div class="actions"><button class="btn ghost" type="button" data-back="baseOv" data-i18n="nav.back"></button></div>
    </div>
  </div>

  <!-- Chọn thẻ: lên cấp / rương boss -->
  <div class="overlay" id="cardsOv" hidden>
    <div class="cards-wrap">
      <div class="cards-head">
        <h2 id="cardsTitle"></h2>
        <p id="cardsSub"></p>
      </div>
      <div class="cards" id="cards"></div>
      <button class="btn ghost small" type="button" id="rerollBtn" hidden></button>
      <div class="build" id="cardsBuild"></div>
    </div>
  </div>

  <!-- Tạm dừng -->
  <div class="overlay" id="pauseOv" hidden>
    <div class="panel">
      <span class="eyebrow" data-i18n="pause.eyebrow"></span>
      <h2 class="title sub" data-i18n="pause.title"></h2>
      <div class="build left" id="pauseBuild"></div>
      <dl class="keys" id="keysList2"></dl>
      <div class="actions">
        <button class="btn" id="resumeBtn" type="button" data-i18n="pause.resume"></button>
        <button class="btn ghost" id="quitBtn" type="button" data-i18n="pause.quit"></button>
      </div>
    </div>
  </div>

  <!-- Kết quả -->
  <div class="overlay" id="resultOv" hidden>
    <div class="panel">
      <span class="eyebrow" id="resEyebrow" data-i18n="result.eyebrow"></span>
      <h2 class="title sub" id="resTitle"></h2>
      <p class="lead" id="resLead"></p>
      <div class="stats">
        <div class="stat"><span class="label" data-i18n="result.wave"></span><b id="rWave">0</b></div>
        <div class="stat"><span class="label" data-i18n="result.kills"></span><b id="rKills">0</b></div>
        <div class="stat core"><span class="label" data-i18n="result.cores"></span><b id="rCores">0</b></div>
        <div class="stat metal"><span class="label" data-i18n="result.metal"></span><b id="rMetal">0</b></div>
      </div>
      <div class="build left" id="resBuild"></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button" data-i18n="result.again"></button>
        <button class="btn ghost" id="menuBtn" type="button" data-i18n="result.menu"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
